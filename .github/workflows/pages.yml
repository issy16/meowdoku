# Publishes the web app (R11.13) at https://issy16.github.io/meowdoku/.
# Runs the tests first; the site is web/ assembled with the meowdoku package.
# Needs Settings → Pages → Source set to "GitHub Actions" in this repository.
name: Publish web app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Assemble the site
        run: python web/assemble.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
