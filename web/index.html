<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meowdoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Every path here is relative to the page, so the app works under /meowdoku/ (R11.14). -->
  <main>
    <header>
      <h1>Meowdoku</h1>
      <div class="settings">
        <button id="theme" type="button" data-choice="auto" data-name="ui.theme_auto" aria-label="Appearance: Auto">
          <svg class="auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
          <svg class="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <label class="language">
          <span class="visually-hidden" data-label="ui.language">Language</span>
          <select id="language"></select>
        </label>
      </div>
    </header>
    <p id="status" role="status">Loading…</p>

    <div class="card">
      <div id="board" class="board" aria-label="Puzzle board"></div>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <div class="buttons controls">
      <button id="open" type="button" data-label="ui.open">Open</button>
      <button id="previous" type="button" class="icon" data-name="ui.previous" aria-label="Previous" title="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="next" type="button" class="icon" data-name="ui.next" aria-label="Next" title="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button id="hint" type="button" data-label="ui.hint">Hint</button>
      <button id="step" type="button" data-label="ui.step">Step by Step</button>
      <button id="solve" type="button" data-label="ui.solve">Solve</button>
      <button id="reset" type="button" data-label="ui.reset">Reset</button>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg" hidden>

    <!-- Hidden from players; add ?timings to the address to measure speed (R11.12). -->
    <details class="timings" id="timings-panel" hidden>
      <summary data-label="ui.timings">Timings</summary>
      <p data-label="ui.timings_note">How long each step took in this browser (R11.12).</p>
      <table><tbody id="timings"></tbody></table>
      <div class="buttons">
        <button id="sample" type="button" data-label="ui.sample">Open sample screenshot</button>
        <button id="measure" type="button" data-label="ui.measure">Measure hints and Solve</button>
      </div>
    </details>
  </main>

  <div id="popup" class="popup" hidden>
    <div class="popup-card" role="dialog" aria-labelledby="popup-title">
      <p id="popup-title" class="popup-title" data-label="ui.solved_title">Puzzle solved!</p>
      <p class="popup-subtitle" data-label="ui.solved_subtitle">Well done!</p>
      <button id="popup-ok" type="button" data-label="ui.ok">OK</button>
    </div>
  </div>

  <!-- The lucky cat face (R8.2), drawn in shares of a tile like gui.py's. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="cat" viewBox="0 0 100 100">
      <g class="cat-outline" stroke-width="4.5" stroke-linejoin="round">
        <polygon points="10,52 17,4 46,28"/>
        <polygon points="90,52 83,4 54,28"/>
        <ellipse cx="50" cy="58" rx="43" ry="36"/>
      </g>
      <g class="cat-ink-line" stroke-width="3.6" fill="none" stroke-linecap="round">
        <polyline points="19,30 20,13 33,24"/>
        <polyline points="81,30 80,13 67,24"/>
        <line x1="44" y1="28" x2="44" y2="38"/>
        <line x1="50" y1="28" x2="50" y2="38"/>
        <line x1="56" y1="28" x2="56" y2="38"/>
        <ellipse cx="31" cy="54.5" rx="10" ry="6.5"/>
        <ellipse cx="69" cy="54.5" rx="10" ry="6.5"/>
        <path d="M41 75 Q45.5 79 50 74 Q54.5 79 59 75"/>
      </g>
      <g class="cat-ink-fill">
        <ellipse cx="31" cy="54.5" rx="3.5" ry="5.5"/>
        <ellipse cx="69" cy="54.5" rx="3.5" ry="5.5"/>
        <polygon points="46,67 54,67 50,71"/>
      </g>
    </symbol>
  </svg>

  <script src="app.js"></script>
</body>
</html>
