[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowdoku"
version = "0.1.0"
description = "Solver for Meowdoku puzzles using constraint satisfaction and backtracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
image = ["Pillow>=10"]

[project.scripts]
meowdoku = "meowdoku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
